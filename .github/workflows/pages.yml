name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 先跑撮合引擎、定期定額、資料介面、存檔還原的測試，沒過就不上線
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/engine_test.mjs
      - run: node tests/dca_test.mjs
      - run: node tests/data_test.mjs
      - run: node tests/store_test.mjs
      - name: 打包網站（service worker 的版本號＝介面檔案的指紋）
        run: |
          mkdir -p public
          cp -r index.html styles.css manifest.webmanifest sw.js src vendor icons public/
          v=$(cat index.html styles.css manifest.webmanifest src/*.js | sha1sum | cut -c1-12)
          sed -i "s/__BUILD__/$v/" public/sw.js
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
