<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>沙盤 SANDTABLE</title>
<meta name="description" content="台股 ETF 真實模擬操盤：真的行情、真的規則、假的錢。">
<meta name="theme-color" content="#040405">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="沙盤">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Rajdhani:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <div class="brand"><svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1cf"/><stop offset=".5" stop-color="#f2b84b"/><stop offset="1" stop-color="#9a6a24"/></linearGradient></defs><path d="M20 2.5 35.2 11.25v17.5L20 37.5 4.8 28.75v-17.5z" fill="none" stroke="url(#lg)" stroke-width="2"/><path d="M20 10.5 28.2 15.25v9.5L20 29.5l-8.2-4.75v-9.5z" fill="url(#lg)" opacity=".9"/><path d="M20 15.5 23.9 17.75v4.5L20 24.5l-3.9-2.25v-4.5z" fill="#040405"/></svg><span class="mk">沙盤</span><span class="en">SANDTABLE</span></div>
    <div class="clock"><b id="clk" class="num">--:--:--</b><span class="sub"><span id="phase" class="phase">連線中</span><span id="feed" class="feed" data-s="off"><i></i><span id="feedT"></span></span></span></div>
    <div class="row" style="gap:12px">
      <nav class="desk-nav" id="deskNav">
        <button class="btn sm ghost" data-desk="report">戰報與設定</button>
      </nav>
      <div class="acct" id="acct"><div class="eq num">—</div><div class="rt num dim">總資產</div></div>
    </div>
  </header>

  <main class="main" id="main">
    <section class="stage" id="stage" aria-label="3D 戰情沙盤">
      <div class="stage-loading" id="stageLoading">戰術台啟動中</div>
      <div class="hud-top"><div class="hud-chip" id="hudTx"></div><div class="hud-chip r" id="hudClose"></div></div>
      <div class="hud-bot"><div class="breadth" id="hudBreadth"></div><button class="stage-btn" id="stageReset" type="button">回到全景</button></div>
      <div class="stage-tip" id="stageTip" hidden></div>
    </section>
    <section class="panes">
      <div class="pane" data-p="table" id="pTable"></div>
      <div class="pane" data-p="quote" id="pQuote"></div>
      <div class="pane" data-p="orders" id="pOrders"></div>
      <div class="pane" data-p="pos" id="pPos"></div>
      <div class="pane" data-p="report" id="pReport"></div>
    </section>
  </main>

  <nav class="dock" id="dock" aria-label="分頁">
    <button data-tab="table" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2.8 19.6 7.2v9.6L12 21.2 4.4 16.8V7.2z"/><path d="M12 8.2 15.3 10v3.9L12 15.8 8.7 13.9V10z"/></svg>沙盤</button>
    <button data-tab="quote"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 4v16M12 3v18M18 6v12"/><rect x="4.2" y="8" width="3.6" height="6" fill="currentColor"/><rect x="10.2" y="6" width="3.6" height="9"/><rect x="16.2" y="9" width="3.6" height="5" fill="currentColor"/></svg>看盤</button>
    <button data-tab="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3" stroke-linecap="round"/></svg>委託<span class="badge" id="badgeOrders" hidden></span></button>
    <button data-tab="pos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 21V3"/><path d="M6 4h11l-2.6 3.8L17 11.5H6" fill="currentColor" fill-opacity=".25"/></svg>庫存</button>
    <button data-tab="report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="m5 15 4-5 4 3 6-7"/><path d="M15 6h4v4"/></svg>戰報</button>
  </nav>
</div>

<div id="sheetHost"></div>
<div id="modalHost"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<div class="ignite" id="ignite" hidden>
  <div>
    <svg class="emblem" viewBox="0 0 200 200" aria-hidden="true"><defs><linearGradient id="eg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1cf"/><stop offset=".5" stop-color="#f2b84b"/><stop offset="1" stop-color="#8d5d18"/></linearGradient></defs>
      <g class="spin"><circle cx="100" cy="100" r="92" fill="none" stroke="#f2b84b" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="2 7"/><path d="M100 4v14M100 182v14M4 100h14M182 100h14" stroke="#ffd98e" stroke-width="2"/></g>
      <g class="spin2"><circle cx="100" cy="100" r="78" fill="none" stroke="#ffd98e" stroke-opacity=".8" stroke-width="2" stroke-dasharray="70 52"/></g>
      <path d="M100 38 153.7 69v62L100 162 46.3 131V69z" fill="none" stroke="url(#eg)" stroke-width="3"/>
      <path d="M100 62 133 81v38L100 138 67 119V81z" fill="url(#eg)" opacity=".92"/>
      <path d="M100 84 114 92v16L100 116 86 108V92z" fill="#040405"/></svg>
    <div class="t">沙盤</div>
    <div class="e">SANDTABLE</div>
    <button class="cord" id="cord" type="button" aria-label="啟動戰術台，進入沙盤">啟動戰術台</button>
    <div class="sub">真的行情・真的規則・假的錢</div>
  </div>
</div>
<noscript><p style="padding:20px">沙盤需要開啟 JavaScript。</p></noscript>
<script type="module" src="src/app.js"></script>
</body>
</html>
